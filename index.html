<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Social Links Profile</title>
</head>
<body>
  <main>
    <div class="card">
      <div class="card__avatar">
        <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
      </div>
      <div class="card__content">
        <h1 class="card__name">Jessica Randall</h1>
        <p class="card__location">London, United Kingdom</p>
      </div>
      <div class="card__bio">
        <p>"Front-end developer and avid reader.".</p>
      </div>
      <div class="card__buttons">
        <button class="card__button">Github</button>
        <button class="card__button">Frontend Mentor</button>
        <button class="card__button">LinkedIn</button>
        <button class="card__button">Twitter</button>
        <button class="card__button">Instagram</button>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a class="attribution__link" href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a class="attribution__link" href="https://www.frontendmentor.io/profile/jorlabor">James Labor</a>.
  </footer>
</body>
</html>
